<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arimori Studios | Architects of Enduring Systems</title>

  <meta property="og:title" content="Arimori Studios | Architects of Enduring Systems" />
  <meta property="og:description" content="Sovereign digital infrastructure, offline-first counter POS, and POPIA-encrypted vaults." />
  <meta property="og:url" content="https://arimori.studio" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/shell.css" />

  <style>
    main#page-content {
      padding-top: 0;
      position: relative;
      background: #030504;
    }

    .scroll-runway {
      height: 520vh;
      position: relative;
      width: 100%;
    }

    .stage-viewport {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #030504;
    }

    #arimori-webgl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Phase 5 Permanent Slogan Positioned Cleanly Between Top Logo & Stratosphere Orb */
    .slogan-overlay {
      position: absolute;
      top: 23.5vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.65s ease, transform 0.65s ease;
      width: 92%;
      max-width: 720px;
    }

    .slogan-overlay.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .slogan-brand {
      font-family: var(--font-mono);
      font-size: clamp(0.68rem, 1.2vw, 0.8rem);
      font-weight: 700;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: #fde68a;
      margin-bottom: 0.35rem;
    }

    .slogan-title {
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 2.5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #f8fafc;
      text-shadow: 0 0 28px rgba(251, 191, 36, 0.38), 0 4px 16px rgba(0, 0, 0, 0.9);
    }

    .scroll-cue {
      position: absolute;
      bottom: 2.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .scroll-cue span {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(248, 250, 252, 0.58);
    }

    .scroll-line {
      width: 1px;
      height: 34px;
      background: linear-gradient(180deg, rgba(251, 191, 36, 0.85), transparent);
      animation: pulseLine 2s ease-in-out infinite;
    }

    @keyframes pulseLine {
      0%, 100% { transform: scaleY(0.65); opacity: 0.45; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    .annotations-layer {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
    }

    .orb-annotation {
      position: absolute;
      display: flex;
      align-items: center;
      pointer-events: auto;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.45s ease, transform 0.35s ease;
    }

    .orb-annotation.revealed {
      opacity: 1;
    }

    .orb-annotation.align-right {
      flex-direction: row;
      transform: translateX(0);
    }

    .orb-annotation.align-left {
      flex-direction: row-reverse;
      text-align: right;
      transform: translateX(-100%);
    }

    .leader-stem {
      width: clamp(32px, 6vw, 84px);
      height: 1.5px;
      position: relative;
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .orb-annotation.align-left .leader-stem {
      transform-origin: right center;
    }

    .orb-annotation.revealed .leader-stem {
      transform: scaleX(1);
    }

    .leader-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .leader-card {
      padding: 0.55rem 0.85rem;
      border-radius: 14px;
      background: rgba(6, 10, 14, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
      max-width: 275px;
    }

    .orb-annotation:hover .leader-card,
    .orb-annotation.highlighted .leader-card {
      background: rgba(10, 16, 22, 0.96);
      transform: translateY(-2px);
    }

    .leader-tier-tag {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: block;
    }

    .leader-title {
      font-family: var(--font-display);
      font-size: clamp(0.84rem, 1.25vw, 0.98rem);
      font-weight: 700;
      color: #f8fafc;
      margin: 2px 0;
      display: block;
    }

    .leader-desc {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      color: #94a3b8;
      line-height: 1.38;
      display: block;
    }

    .leader-price {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      margin-top: 4px;
      opacity: 0.95;
      display: block;
    }

    @media (max-width: 768px) {
      .slogan-overlay {
        top: 21vh;
      }
      .orb-annotation.align-left {
        flex-direction: row;
        text-align: left;
        transform: translateX(0);
      }
      .orb-annotation.align-left .leader-stem {
        transform-origin: left center;
      }
      .leader-stem {
        width: 18px;
      }
      .leader-card {
        max-width: 195px;
        padding: 0.4rem 0.6rem;
      }
      .leader-desc {
        display: none;
      }
    }

    .warp-flash {
      position: fixed;
      inset: 0;
      z-index: 1500;
      background: #030504;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease;
    }
    .warp-flash.active {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body class="home-void">

  <main id="page-content">
    <div class="scroll-runway" id="scrollRunway">
      <div class="stage-viewport" id="stageViewport">
        <canvas id="arimori-webgl"></canvas>

        <!-- Phase 5 Slogan With Generous Vertical Spacing -->
        <div class="slogan-overlay" id="voidSlogan">
          <div class="slogan-brand">ARIMORI STUDIOS</div>
          <h1 class="slogan-title">Architects of Enduring Systems</h1>
        </div>

        <div class="scroll-cue" id="scrollCue">
          <span>Scroll to Dive</span>
          <div class="scroll-line"></div>
        </div>

        <div class="annotations-layer" id="annotationsLayer"></div>
      </div>
    </div>
  </main>

  <div class="warp-flash" id="warpFlash"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script src="js/shell.js"></script>

  <script>
    (function () {
      gsap.registerPlugin(ScrollTrigger);

      const canvas = document.getElementById('arimori-webgl');
      const viewport = document.getElementById('stageViewport');
      const annotationsLayer = document.getElementById('annotationsLayer');
      const voidSlogan = document.getElementById('voidSlogan');
      const scrollCue = document.getElementById('scrollCue');
      const warpFlash = document.getElementById('warpFlash');

      const isMobile = window.innerWidth < 768;

      const TIER_ORBS = [
        {
          id: 'orb-stratosphere',
          tier: 'TIER 05 // STRATOSPHERE',
          name: 'The Enterprise Foundation',
          desc: 'One master dashboard for multi-branch businesses, early late-payment alerts, and hands-on support.',
          price: 'R16,500 Setup + R3,200/mo',
          color: '#38BDF8',
          type: 'stratosphere',
          texturePath: 'assets/images/orb-stratosphere.jpg',
          url: 'tier-05.html',
          align: 'right'
        },
        {
          id: 'orb-atmosphere',
          tier: 'TIER 04 // ATMOSPHERE',
          name: 'The Remote Exchange',
          desc: 'Easy phone payments via Instant EFT & Capitec Pay with automatic deposit matching.',
          price: 'R12,500 Setup + R2,250/mo',
          color: '#F8FAFC',
          type: 'atmosphere',
          texturePath: 'assets/images/orb-atmosphere.jpg',
          url: 'tier-04.html',
          align: 'left'
        },
        {
          id: 'orb-forest',
          tier: 'TIER 03 // FOREST FLOOR (HERO)',
          name: 'The Counter Standard',
          desc: 'Fast receipt printer, offline shop till that works without internet, and safe POPIA record storage.',
          price: 'R9,500 Setup + R1,500/mo',
          color: '#10B981',
          type: 'forest',
          texturePath: 'assets/images/orb-forest.jpg',
          url: 'tier-03.html',
          align: 'right'
        },
        {
          id: 'orb-crust',
          tier: 'TIER 02 // CRUST',
          name: 'The Growth Launchpad',
          desc: 'WhatsApp price catalog, instant automatic replies, and bookings synced to your phone calendar.',
          price: 'R6,500 Setup + R1,250/mo',
          color: '#A8A29E',
          type: 'crust',
          texturePath: 'assets/images/orb-crust.jpg',
          url: 'tier-02.html',
          align: 'left'
        },
        {
          id: 'orb-core',
          tier: 'TIER 01 // CORE / MANTLE',
          name: 'The Discovery Suite',
          desc: 'Verified Google Maps pin and a clean 4-page website with a direct WhatsApp button.',
          price: 'R2,500 Setup + R450/mo',
          color: '#F97316',
          type: 'core',
          texturePath: 'assets/images/orb-core.jpg',
          url: 'tier-01.html',
          align: 'right'
        }
      ];

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030504);

      const camera = new THREE.PerspectiveCamera(
        45,
        viewport.clientWidth / viewport.clientHeight,
        0.1,
        200
      );
      camera.position.set(0, 7.2, 14);

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene.add(new THREE.AmbientLight(0xffffff, 0.35));

      const textureLoader = new THREE.TextureLoader();

      /* =====================================================================
         OFFICIAL RADIANT 3D LOGO (USING YOUR ACTUAL LOGO RENDER)
         ===================================================================== */
      const logoGroup = new THREE.Group();
      logoGroup.position.set(0, 7.4, 0);
      scene.add(logoGroup);

      textureLoader.load('assets/images/logo-light.jpg', (logoTex) => {
        const aspect = (logoTex.image && logoTex.image.width) ? (logoTex.image.width / logoTex.image.height) : 1.75;
        const planeH = 2.5;
        const planeW = planeH * aspect;
        const logoGeo = new THREE.PlaneGeometry(planeW, planeH);
        const logoMat = new THREE.MeshBasicMaterial({
          map: logoTex,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        });
        const logoPlane = new THREE.Mesh(logoGeo, logoMat);
        logoGroup.add(logoPlane);
      });

      /* =====================================================================
         PHASE 2: FULL-SCREEN 3D PLANETARY STRATA LAYERS
         ===================================================================== */
      const strataGroup = new THREE.Group();
      scene.add(strataGroup);

      const STRATA_CONFIG = [
        { y: 1.5, color: 0x1e3a8a, emissive: 0x38bdf8, wire: true },
        { y: -4.5, color: 0xe2e8f0, emissive: 0x94a3b8, wire: false },
        { y: -10.5, color: 0x065f46, emissive: 0x10b981, wire: false },
        { y: -16.5, color: 0x57534e, emissive: 0x78716c, wire: false },
        { y: -22.5, color: 0x9a3412, emissive: 0xf97316, wire: false }
      ];

      const strataMeshes = [];
      STRATA_CONFIG.forEach((cfg, idx) => {
        const geo = new THREE.PlaneGeometry(34, 34, 48, 48);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const vx = pos.getX(i);
          const vy = pos.getY(i);
          const dist = Math.hypot(vx, vy);
          const ridge = Math.sin(vx * 0.45 + idx) * Math.cos(vy * 0.45) * 0.85;
          const portal = Math.max(0, 1 - dist / 4.2) * -2.2;
          pos.setZ(i, ridge + portal);
        }
        geo.computeVertexNormals();

        const mat = new THREE.MeshStandardMaterial({
          color: cfg.color,
          emissive: cfg.emissive,
          emissiveIntensity: idx === 4 ? 0.85 : 0.35,
          wireframe: cfg.wire || idx % 2 === 1,
          transparent: true,
          opacity: 0.0,
          side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.y = cfg.y;
        strataGroup.add(mesh);
        strataMeshes.push(mesh);
      });

      /* =====================================================================
         PHASE 3 & 4: ULTRA-FINE MINI STARDUST PIXELS (HIGH DENSITY, TINY SIZE)
         ===================================================================== */
      const particleCount = isMobile ? 2200 : 4800;
      const particleGeo = new THREE.BufferGeometry();
      const basePositions = new Float32Array(particleCount * 3);
      const spherePositions = new Float32Array(particleCount * 3);
      const particleColors = new Float32Array(particleCount * 3);

      const palette = [
        new THREE.Color(0xfde68a),
        new THREE.Color(0x34d399),
        new THREE.Color(0x38bdf8),
        new THREE.Color(0xf97316),
        new THREE.Color(0xffffff)
      ];

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        basePositions[i3] = (Math.random() - 0.5) * 22;
        basePositions[i3 + 1] = -8 - Math.random() * 22;
        basePositions[i3 + 2] = (Math.random() - 0.5) * 22;

        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = 1.65 + (Math.random() - 0.5) * 0.08;
        spherePositions[i3] = r * Math.sin(phi) * Math.cos(theta);
        spherePositions[i3 + 1] = -26 + r * Math.cos(phi);
        spherePositions[i3 + 2] = r * Math.sin(phi) * Math.sin(theta);

        const c = palette[i % palette.length];
        particleColors[i3] = c.r;
        particleColors[i3 + 1] = c.g;
        particleColors[i3 + 2] = c.b;
      }

      particleGeo.setAttribute('position', new THREE.BufferAttribute(basePositions.slice(), 3));
      particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

      const particleMat = new THREE.PointsMaterial({
        size: isMobile ? 0.036 : 0.026,
        vertexColors: true,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const particleSystem = new THREE.Points(particleGeo, particleMat);
      scene.add(particleSystem);

      /* =====================================================================
         PHASE 5: THE 5 IDENTICAL ORBS (LOWERED STACK FOR SLOGAN BREATHING ROOM)
         ===================================================================== */
      const voidGroup = new THREE.Group();
      voidGroup.visible = false;
      scene.add(voidGroup);

      const ORB_RADIUS = 0.85;
      const ORB_Y_POSITIONS = [1.4, -1.4, -4.2, -7.0, -9.8];

      function createPlanetaryMaterial(orbCfg) {
        const uniforms = {
          uTime: { value: 0 },
          uType: { value: ['stratosphere', 'atmosphere', 'forest', 'crust', 'core'].indexOf(orbCfg.type) },
          uHover: { value: 0 },
          uMap: { value: null },
          uHasMap: { value: 0 }
        };

        textureLoader.load(
          orbCfg.texturePath,
          (tex) => {
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            uniforms.uMap.value = tex;
            uniforms.uHasMap.value = 1;
          },
          undefined,
          () => {}
        );

        return new THREE.ShaderMaterial({
          uniforms,
          vertexShader: `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPos;
            void main() {
              vUv = uv;
              vNormal = normalize(normalMatrix * normal);
              vPos = position;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform float uTime;
            uniform int uType;
            uniform float uHover;
            uniform sampler2D uMap;
            uniform float uHasMap;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPos;

            void main() {
              vec3 lightDir = normalize(vec3(0.35, 0.8, 0.75));
              float diff = max(dot(vNormal, lightDir), 0.35);
              float fresnel = pow(1.0 - max(dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0), 2.5);

              vec3 rimCol = vec3(0.22, 0.74, 0.97);
              if (uType == 1) rimCol = vec3(0.95, 0.98, 1.0);
              else if (uType == 2) rimCol = vec3(0.06, 0.73, 0.51);
              else if (uType == 3) rimCol = vec3(0.75, 0.65, 0.55);
              else if (uType == 4) rimCol = vec3(0.98, 0.45, 0.09);

              vec3 baseCol = rimCol * 0.45 * diff;
              if (uHasMap > 0.5) {
                baseCol = texture2D(uMap, vUv).rgb * (diff * 0.65 + 0.55);
              }

              vec3 finalCol = baseCol + rimCol * fresnel * (0.55 + uHover * 0.65);
              gl_FragColor = vec4(finalCol, 1.0);
            }
          `
        });
      }

      const orbMeshes = [];
      const orbSharedGeo = new THREE.SphereGeometry(ORB_RADIUS, 48, 48);

      TIER_ORBS.forEach((orbCfg, i) => {
        const mat = createPlanetaryMaterial(orbCfg);
        const mesh = new THREE.Mesh(orbSharedGeo, mat);
        mesh.position.set(0, ORB_Y_POSITIONS[i], 0);
        mesh.userData = { index: i, config: orbCfg };
        voidGroup.add(mesh);
        orbMeshes.push(mesh);
      });

      /* =====================================================================
         GOLDEN-WHITE DNA CODE BEAM
         ===================================================================== */
      function createDNACodeTexture() {
        const c = document.createElement('canvas');
        c.width = 1024;
        c.height = 256;
        const ctx = c.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0, 'rgba(255, 251, 235, 0.95)');
        grad.addColorStop(0.5, 'rgba(253, 224, 130, 0.85)');
        grad.addColorStop(1, 'rgba(255, 251, 235, 0.95)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 256);

        ctx.font = 'bold 14px monospace';
        ctx.fillStyle = 'rgba(120, 53, 15, 0.42)';
        const snippets = [
          '0x8F4A::SOVEREIGN_CORE',
          'SHA256_VERIFIED // 99.98%',
          'POPIA_V
