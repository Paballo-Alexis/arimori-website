<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arimori Studios | Architects of Enduring Systems</title>

  <meta property="og:title" content="Arimori Studios | Architects of Enduring Systems" />
  <meta property="og:description" content="Sovereign digital infrastructure, offline-first counter POS, and POPIA-encrypted vaults." />
  <meta property="og:url" content="https://arimori.studio" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/shell.css" />

  <style>
    main#page-content {
      padding-top: 0;
      position: relative;
      background: #030504;
    }

    .scroll-runway {
      height: 500vh;
      position: relative;
      width: 100%;
    }

    .stage-viewport {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #030504;
    }

    #arimori-webgl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Phase 5 Slogan Positioned Cleanly Between Top Logo & Stratosphere Orb */
    .slogan-overlay {
      position: absolute;
      top: 23.5vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      width: 92%;
      max-width: 720px;
    }

    .slogan-overlay.visible {
      opacity: 1;
    }

    .slogan-brand {
      font-family: var(--font-mono);
      font-size: clamp(0.68rem, 1.2vw, 0.8rem);
      font-weight: 700;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: #fde68a;
      margin-bottom: 0.35rem;
    }

    .slogan-title {
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 2.5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #f8fafc;
      text-shadow: 0 0 28px rgba(251, 191, 36, 0.38), 0 4px 16px rgba(0, 0, 0, 0.9);
    }

    .scroll-cue {
      position: absolute;
      bottom: 2.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .scroll-cue span {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(248, 250, 252, 0.65);
    }

    .scroll-line {
      width: 1px;
      height: 34px;
      background: linear-gradient(180deg, rgba(251, 191, 36, 0.85), transparent);
      animation: pulseLine 2s ease-in-out infinite;
    }
    @keyframes pulseLine {
      0%, 100% { transform: scaleY(0.65); opacity: 0.45; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    .annotations-layer {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
    }

    .orb-annotation {
      position: absolute;
      display: flex;
      align-items: center;
      pointer-events: auto;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    .orb-annotation.revealed {
      opacity: 1;
    }

    .orb-annotation.align-right {
      flex-direction: row;
    }

    .orb-annotation.align-left {
      flex-direction: row-reverse;
      text-align: right;
      transform: translateX(-100%);
    }

    .leader-stem {
      width: clamp(28px, 5.5vw, 80px);
      height: 1.5px;
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .orb-annotation.align-left .leader-stem {
      transform-origin: right center;
    }

    .orb-annotation.revealed .leader-stem {
      transform: scaleX(1);
    }

    .leader-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .leader-card {
      padding: 0.55rem 0.85rem;
      border-radius: 14px;
      background: rgba(6, 10, 14, 0.84);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      max-width: 270px;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .orb-annotation:hover .leader-card,
    .orb-annotation.highlighted .leader-card {
      background: rgba(10, 16, 22, 0.96);
      transform: translateY(-2px);
    }

    .leader-tier-tag {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: block;
    }

    .leader-title {
      font-family: var(--font-display);
      font-size: clamp(0.84rem, 1.25vw, 0.98rem);
      font-weight: 700;
      color: #f8fafc;
      margin: 2px 0;
      display: block;
    }

    .leader-desc {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      color: #94a3b8;
      line-height: 1.38;
      display: block;
    }

    .leader-price {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      margin-top: 4px;
      display: block;
                   }
    @media (max-width: 768px) {
      .slogan-overlay { top: 21vh; }
      .orb-annotation.align-left {
        flex-direction: row;
        text-align: left;
        transform: translateX(0);
      }
      .orb-annotation.align-left .leader-stem { transform-origin: left center; }
      .leader-stem { width: 18px; }
      .leader-card { max-width: 195px; padding: 0.4rem 0.6rem; }
      .leader-desc { display: none; }
    }

    .warp-flash {
      position: fixed;
      inset: 0;
      z-index: 1500;
      background: #030504;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease;
    }
    .warp-flash.active { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body class="home-void">

  <main id="page-content">
    <div class="scroll-runway" id="scrollRunway">
      <div class="stage-viewport" id="stageViewport">
        <canvas id="arimori-webgl"></canvas>

        <div class="slogan-overlay" id="voidSlogan">
          <div class="slogan-brand">ARIMORI STUDIOS</div>
          <h1 class="slogan-title">Architects of Enduring Systems</h1>
        </div>

        <div class="scroll-cue" id="scrollCue">
          <span>Scroll to Dive</span>
          <div class="scroll-line"></div>
        </div>

        <div class="annotations-layer" id="annotationsLayer"></div>
      </div>
    </div>
  </main>

  <div class="warp-flash" id="warpFlash"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/shell.js"></script>

  <script>
    (function () {
      if (typeof THREE === 'undefined') {
        console.error('Three.js failed to load.');
        return;
      }

      const canvas = document.getElementById('arimori-webgl');
      const runway = document.getElementById('scrollRunway');
      const viewport = document.getElementById('stageViewport');
      const annotationsLayer = document.getElementById('annotationsLayer');
      const voidSlogan = document.getElementById('voidSlogan');
      const scrollCue = document.getElementById('scrollCue');
      const warpFlash = document.getElementById('warpFlash');

      const isMobile = window.innerWidth < 768;

      const TIER_ORBS = [
        {
          tier: 'TIER 05 // STRATOSPHERE',
          name: 'The Enterprise Foundation',
          desc: 'One master dashboard for multi-branch businesses, early late-payment alerts, and hands-on support.',
          price: 'R16,500 Setup + R3,200/mo',
          color: '#38BDF8',
          rgb: [0.22, 0.74, 0.97],
          texturePath: 'assets/images/orb-stratosphere.jpg',
          url: 'tier-05.html',
          align: 'right'
        },
        {
          tier: 'TIER 04 // ATMOSPHERE',
          name: 'The Remote Exchange',
          desc: 'Easy phone payments via Instant EFT & Capitec Pay with automatic deposit matching.',
          price: 'R12,500 Setup + R2,250/mo',
          color: '#F8FAFC',
          rgb: [0.95, 0.98, 1.0],
          texturePath: 'assets/images/orb-atmosphere.jpg',
          url: 'tier-04.html',
          align: 'left'
        },
        {
          tier: 'TIER 03 // FOREST FLOOR (HERO)',
          name: 'The Counter Standard',
          desc: 'Fast receipt printer, offline shop till that works without internet, and safe POPIA record storage.',
          price: 'R9,500 Setup + R1,500/mo',
          color: '#10B981',
          rgb: [0.06, 0.73, 0.51],
          texturePath: 'assets/images/orb-forest.jpg',
          url: 'tier-03.html',
          align: 'right'
        },
        {
          tier: 'TIER 02 // CRUST',
          name: 'The Growth Launchpad',
          desc: 'WhatsApp price catalog, instant automatic replies, and bookings synced to your phone calendar.',
          price: 'R6,500 Setup + R1,250/mo',
          color: '#D6A276',
          rgb: [0.84, 0.64, 0.46],
          texturePath: 'assets/images/orb-crust.jpg',
          url: 'tier-02.html',
          align: 'left'
        },
        {
          tier: 'TIER 01 // CORE / MANTLE',
          name: 'The Discovery Suite',
          desc: 'Verified Google Maps pin and a clean 4-page website with a direct WhatsApp button.',
          price: 'R2,500 Setup + R450/mo',
          color: '#F97316',
          rgb: [0.98, 0.45, 0.09],
          texturePath: 'assets/images/orb-core.jpg',
          url: 'tier-01.html',
          align: 'right'
        }
      ];
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030504);

      const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 200);
      camera.position.set(0, 7.4, 14);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene.add(new THREE.AmbientLight(0xffffff, 0.45));

      const textureLoader = new THREE.TextureLoader();

      /* 1. TOP APEX LOGO WITH SELF-HEALING FALLBACK */
      const logoGroup = new THREE.Group();
      logoGroup.position.set(0, 7.4, 0);
      scene.add(logoGroup);

      function buildFallbackLogo() {
        const ringGeo = new THREE.TorusGeometry(1.1, 0.06, 16, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xfde68a });
        const coreGeo = new THREE.OctahedronGeometry(0.65, 1);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x34d399, wireframe: true });
        logoGroup.add(new THREE.Mesh(ringGeo, ringMat), new THREE.Mesh(coreGeo, coreMat));
      }

      function mountLogoTexture(tex) {
        const aspect = (tex.image && tex.image.width) ? (tex.image.width / tex.image.height) : 1.75;
        const planeH = 2.6;
        const planeGeo = new THREE.PlaneGeometry(planeH * aspect, planeH);
        const planeMat = new THREE.MeshBasicMaterial({
          map: tex,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        });
        logoGroup.add(new THREE.Mesh(planeGeo, planeMat));
      }

      textureLoader.load(
        'assets/images/logo-light.jpg',
        mountLogoTexture,
        undefined,
        () => {
          textureLoader.load('assets/images/logo-light.png', mountLogoTexture, undefined, buildFallbackLogo);
        }
      );

      /* 2. PHASE 2: PLANETARY STRATA LAYERS */
      const strataGroup = new THREE.Group();
      scene.add(strataGroup);

      const STRATA_CONFIG = [
        { y: 1.5, color: 0x1e3a8a, emissive: 0x38bdf8, wire: true },
        { y: -4.5, color: 0xe2e8f0, emissive: 0x94a3b8, wire: false },
        { y: -10.5, color: 0x065f46, emissive: 0x10b981, wire: false },
        { y: -16.5, color: 0x57534e, emissive: 0x78716c, wire: false },
        { y: -22.5, color: 0x9a3412, emissive: 0xf97316, wire: false }
      ];

      const strataMeshes = STRATA_CONFIG.map((cfg, idx) => {
        const geo = new THREE.PlaneGeometry(34, 34, 44, 44);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const vx = pos.getX(i);
          const vy = pos.getY(i);
          const dist = Math.hypot(vx, vy);
          const ridge = Math.sin(vx * 0.45 + idx) * Math.cos(vy * 0.45) * 0.85;
          const portal = Math.max(0, 1 - dist / 4.2) * -2.2;
          pos.setZ(i, ridge + portal);
        }
        geo.computeVertexNormals();

        const mat = new THREE.MeshStandardMaterial({
          color: cfg.color,
          emissive: cfg.emissive,
          emissiveIntensity: idx === 4 ? 0.85 : 0.35,
          wireframe: cfg.wire || idx % 2 === 1,
          transparent: true,
          opacity: 0.0,
          side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.y = cfg.y;
        strataGroup.add(mesh);
        return mesh;
      });

      /* 3. PHASE 3 & 4: ULTRA-FINE MINI STARDUST PIXELS */
      const particleCount = isMobile ? 2200 : 4800;
      const particleGeo = new THREE.BufferGeometry();
      const basePositions = new Float32Array(particleCount * 3);
      const spherePositions = new Float32Array(particleCount * 3);
      const particleColors = new Float32Array(particleCount * 3);

      const palette = [
        new THREE.Color(0xfde68a),
        new THREE.Color(0x34d399),
        new THREE.Color(0x38bdf8),
        new THREE.Color(0xf97316),
        new THREE.Color(0xffffff)
      ];

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        basePositions[i3] = (Math.random() - 0.5) * 22;
        basePositions[i3 + 1] = -8 - Math.random() * 22;
        basePositions[i3 + 2] = (Math.random() - 0.5) * 22;

        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = 1.65 + (Math.random() - 0.5) * 0.08;
        spherePositions[i3] = r * Math.sin(phi) * Math.cos(theta);
        spherePositions[i3 + 1] = -26 + r * Math.cos(phi);
        spherePositions[i3 + 2] = r * Math.sin(phi) * Math.sin(theta);

        const c = palette[i % palette.length];
        particleColors[i3] = c.r;
        particleColors[i3 + 1] = c.g;
        particleColors[i3 + 2] = c.b;
      }

      particleGeo.setAttribute('position', new THREE.BufferAttribute(basePositions.slice(), 3));
      particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

      const particleMat = new THREE.PointsMaterial({
        size: isMobile ? 0.036 : 0.026,
        vertexColors: true,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      scene.add(new THREE.Points(particleGeo, particleMat));

      /* 4. PHASE 5: 5 IDENTICAL ORBS + GOLDEN DNA CODE BEAM */
      const voidGroup = new THREE.Group();
      voidGroup.visible = false;
      scene.add(voidGroup);

      const ORB_RADIUS = 0.85;
      const ORB_Y_POSITIONS = [1.4, -1.4, -4.2, -7.0, -9.8];
      const orbSharedGeo = new THREE.SphereGeometry(ORB_RADIUS, 48, 48);

      const orbMeshes = TIER_ORBS.map((orbCfg, i) => {
        const uniforms = {
          uHover: { value: 0 },
          uMap: { value: null },
          uHasMap: { value: 0 },
          uRim: { value: new THREE.Vector3(orbCfg.rgb[0], orbCfg.rgb[1], orbCfg.rgb[2]) }
        };

        textureLoader.load(orbCfg.texturePath, (tex) => {
          uniforms.uMap.value = tex;
          uniforms.uHasMap.value = 1;
        });

        const mat = new THREE.ShaderMaterial({
          uniforms,
          vertexShader: `
            varying vec2 vUv;
            varying vec3 vNormal;
            void main() {
              vUv = uv;
              vNormal = normalize(normalMatrix * normal);
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform float uHover;
            uniform sampler2D uMap;
            uniform float uHasMap;
            uniform vec3 uRim;
            varying vec2 vUv;
            varying vec3 vNormal;
            void main() {
              vec3 lightDir = normalize(vec3(0.35, 0.8, 0.75));
              float diff = max(dot(vNormal, lightDir), 0.35);
              float fresnel = pow(1.0 - max(dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0), 2.5);
              vec3 baseCol = uRim * 0.55 * diff;
              if (uHasMap > 0.5) {
                baseCol = texture2D(uMap, vUv).rgb * (diff * 0.65 + 0.55);
              }
              gl_FragColor = vec4(baseCol + uRim * fresnel * (0.55 + uHover * 0.65), 1.0);
            }
          `
        });

        const mesh = new THREE.Mesh(orbSharedGeo, mat);
        mesh.position.set(0, ORB_Y_POSITIONS[i], 0);
        mesh.userData = { index: i };
        voidGroup.add(mesh);
        return mesh;
      });

      function createDNACodeTexture() {
        const c = document.createElement('canvas');
        c.width = 1024;
        c.height = 256;
        const ctx = c.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0, 'rgba(255, 251, 235, 0.95)');
        grad.addColorStop(0.5, 'rgba(253, 224, 130, 0.85)');
        grad.addColorStop(1, 'rgba(255, 251, 235, 0.95)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 256);

        ctx.font = 'bold 14px monospace';
        ctx.fillStyle = 'rgba(120, 53, 15, 0.42)';
        const snippets = ['0x8F4A::SOVEREIGN_CORE', 'SHA256_VERIFIED // 99.98%', 'POPIA_VAULT_ACTIVE [AES-256]', 'ARIMORI::ENDURING_SYSTEMS'];
        for (let row = 0; row < 6; row++) {
          ctx.fillText(snippets[row % snippets.length].repeat(4), (row * 47) % 180, 32 + row * 40);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(6, 1);
        return tex;
      }

      const dnaCodeTexture = createDNACodeTexture();

      function buildDNAStrand(phaseOffset, radiusScale) {
        const points = [];
        const steps = 160;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const y = THREE.MathUtils.lerp(5.4, -10.5, t);
          const envelope = Math.sin(Math.min(1, t * 4.5) * (Math.PI / 2));
          const angle = t * Math.PI * 5.0 + phaseOffset;
          const weaveRadius = 1.45 * envelope * radiusScale;
          points.push(new THREE.Vector3(Math.sin(angle) * weaveRadius, y, Math.cos(angle) * (weaveRadius * 0.85)));
        }
        const curve = new THREE.CatmullRomCurve3(points);
        const tubeGeo = new THREE.TubeGeometry(curve, 220, 0.05 * radiusScale, 10, false);
        const tubeMat = new THREE.MeshBasicMaterial({
          map: dnaCodeTexture,
          color: 0xfff3c4,
          transparent: true,
          opacity: 0.92,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        return new THREE.Mesh(tubeGeo, tubeMat);
          }
      const dnaStrandA = buildDNAStrand(0, 1.0);
      const dnaStrandB = buildDNAStrand(Math.PI, 0.72);
      voidGroup.add(dnaStrandA, dnaStrandB);

      /* 5. SIDE LEADER ANNOTATIONS */
      const annotationEls = TIER_ORBS.map((orbCfg, idx) => {
        const el = document.createElement('div');
        el.className = `orb-annotation align-${orbCfg.align}`;
        el.innerHTML = `
          <div class="leader-dot" style="background:${orbCfg.color}; box-shadow: 0 0 10px ${orbCfg.color};"></div>
          <div class="leader-stem" style="background: linear-gradient(90deg, ${orbCfg.color}, rgba(255,255,255,0.2)); box-shadow: 0 0 8px ${orbCfg.color};"></div>
          <div class="leader-card" style="border-color: ${orbCfg.color}44;">
            <span class="leader-tier-tag" style="color:${orbCfg.color};">${orbCfg.tier}</span>
            <span class="leader-title">${orbCfg.name}</span>
            <span class="leader-desc">${orbCfg.desc}</span>
            <span class="leader-price" style="color:${orbCfg.color};">${orbCfg.price}</span>
          </div>
        `;
        el.addEventListener('mouseenter', () => highlightOrb(idx, true));
        el.addEventListener('mouseleave', () => highlightOrb(idx, false));
        el.addEventListener('click', () => triggerOrbDive(idx));
        annotationsLayer.appendChild(el);
        return el;
      });

      function highlightOrb(index, active) {
        orbMeshes.forEach((m, i) => {
          m.material.uniforms.uHover.value = (i === index && active) ? 1.0 : 0.0;
          const s = (i === index && active) ? 1.14 : 1.0;
          m.scale.set(s, s, s);
        });
        annotationEls.forEach((el, i) => el.classList.toggle('highlighted', i === index && active));
      }

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let isDiving = false;

      canvas.addEventListener('click', (e) => {
        if (!voidGroup.visible || isDiving) return;
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(orbMeshes);
        if (hits.length > 0) triggerOrbDive(hits[0].object.userData.index);
      });

      function triggerOrbDive(index) {
        if (isDiving) return;
        isDiving = true;
        warpFlash.classList.add('active');
        setTimeout(() => { window.location.href = TIER_ORBS[index].url; }, 450);
      }

      /* 6. NATIVE SCROLL PROGRESS ENGINE (ZERO EXTERNAL DEPENDENCY FAILURE) */
      function getScrollProgress() {
        const maxScroll = runway.offsetHeight - window.innerHeight;
        if (maxScroll <= 0) return 0;
        return THREE.MathUtils.clamp(window.scrollY / maxScroll, 0, 1);
      }

      function updateParticles(morphFactor) {
        const posAttr = particleGeo.attributes.position;
        for (let i = 0; i < particleCount; i++) {
          const i3 = i * 3;
          posAttr.array[i3] = THREE.MathUtils.lerp(basePositions[i3], spherePositions[i3], morphFactor);
          posAttr.array[i3 + 1] = THREE.MathUtils.lerp(basePositions[i3 + 1], spherePositions[i3 + 1], morphFactor);
          posAttr.array[i3 + 2] = THREE.MathUtils.lerp(basePositions[i3 + 2], spherePositions[i3 + 2], morphFactor);
        }
        posAttr.needsUpdate = true;
      }

      function applyScrollChoreography(p) {
        if (isDiving) return;
        scrollCue.style.opacity = p < 0.04 ? '1' : '0';

        if (p < 0.14) {
          const t = p / 0.14;
          logoGroup.visible = true;
          logoGroup.position.set(0, 7.4, 0);
          logoGroup.scale.setScalar(1 + t * 0.12);
          camera.position.set(0, 7.4 - t * 2.5, 14 - t * 3.5);
          camera.lookAt(0, 7.4 - t * 3.5, 0);
          strataMeshes.forEach((m) => (m.material.opacity = t * 0.35));
          particleMat.opacity = 0;
          voidGroup.visible = false;
          voidSlogan.classList.remove('visible');
          annotationEls.forEach((el) => el.classList.remove('revealed'));
        } else if (p < 0.48) {
          const t = (p - 0.14) / 0.34;
          logoGroup.visible = t < 0.25;
          const diveY = THREE.MathUtils.lerp(4.9, -23.5, t);
          camera.position.set(0, diveY + 2.4, 9.2);
          camera.lookAt(0, diveY - 2.0, 0);
          strataMeshes.forEach((m) => {
            const dist = Math.abs(m.position.y - diveY);
            m.material.opacity = THREE.MathUtils.clamp(1.1 - dist / 9.5, 0.08, 0.82);
          });
          particleMat.opacity = THREE.MathUtils.clamp((t - 0.65) * 2.8, 0, 0.65);
          voidGroup.visible = false;
          voidSlogan.classList.remove('visible');
          annotationEls.forEach((el) => el.classList.remove('revealed'));
        } else if (p < 0.68) {
          const t = (p - 0.48) / 0.20;
          logoGroup.visible = false;
          strataMeshes.forEach((m) => (m.material.opacity = Math.max(0, (1 - t) * 0.45)));
          camera.position.set(0, -24.5 - t * 1.5, 9.2 - t * 2.2);
          camera.lookAt(0, -26, 0);
          particleMat.opacity = 0.65 + t * 0.35;
          updateParticles(t * 0.35);
          voidGroup.visible = false;
          voidSlogan.classList.remove('visible');
          annotationEls.forEach((el) => el.classList.remove('revealed'));
        } else if (p < 0.82) {
          const t = (p - 0.68) / 0.14;
          logoGroup.visible = false;
          strataMeshes.forEach((m) => (m.material.opacity = 0));
          updateParticles(0.35 + Math.min(1, t * 1.45) * 0.65);
          particleMat.opacity = 1 - Math.max(0, (t - 0.72) * 3.5);
          camera.position.set(0, -26, THREE.MathUtils.lerp(7.0, 0.2, t));
          camera.lookAt(0, -26, 0);
          voidGroup.visible = false;
          voidSlogan.classList.remove('visible');
          annotationEls.forEach((el) => el.classList.remove('revealed'));
        } else {
          const t = (p - 0.82) / 0.18;
          strataMeshes.forEach((m) => (m.material.opacity = 0));
          particleMat.opacity = 0;

          logoGroup.visible = true;
          logoGroup.position.set(0, 7.6, 0);
          logoGroup.scale.setScalar(0.88);

          voidGroup.visible = true;
          const zoomOutZ = THREE.MathUtils.lerp(7.0, isMobile ? 31.0 : 25.5, Math.min(1, t * 1.6));
          camera.position.set(0, -1.8, zoomOutZ);
          camera.lookAt(0, -1.8, 0);

          voidSlogan.classList.toggle('visible', t > 0.2);

          const beamAlpha = THREE.MathUtils.clamp((t - 0.15) * 2.5, 0, 0.92);
          dnaStrandA.material.opacity = beamAlpha;
          dnaStrandB.material.opacity = beamAlpha * 0.75;

          const subProgress = (t - 0.5) / 0.5;
          annotationEls.forEach((el, idx) => {
            el.classList.toggle('revealed', subProgress >= idx * 0.16);
          });
        }
      }

      const tempVec = new THREE.Vector3();
      function syncAnnotationPositions() {
        if (!voidGroup.visible) return;
        const width = viewport.clientWidth;
        const height = viewport.clientHeight;
        orbMeshes.forEach((mesh, idx) => {
          const cfg = TIER_ORBS[idx];
          const el = annotationEls[idx];
          const edgeOffset = (!isMobile && cfg.align === 'left') ? -(ORB_RADIUS + 0.12) : (ORB_RADIUS + 0.12);
          tempVec.set(mesh.position.x + edgeOffset, mesh.position.y, mesh.position.z);
          tempVec.project(camera);
          el.style.left = `${(tempVec.x * 0.5 + 0.5) * width}px`;
          el.style.top = `${(-(tempVec.y * 0.5) + 0.5) * height}px`;
          el.style.marginTop = `-${el.offsetHeight / 2}px`;
        });
      }

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();

        applyScrollChoreography(getScrollProgress());

        logoGroup.rotation.y = Math.sin(elapsed * 0.6) * 0.22;
        orbMeshes.forEach((mesh, idx) => {
          mesh.rotation.y = elapsed * (0.22 + idx * 0.03);
          mesh.position.y = ORB_Y_POSITIONS[idx] + Math.sin(elapsed * 1.3 + idx * 1.1) * 0.07;
        });

        dnaCodeTexture.offset.x = -elapsed * 0.14;
        if (voidGroup.visible) syncAnnotationPositions();

        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = viewport.clientWidth / viewport.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
      });

      animate();
    })();
  </script>
</body>
</html>
